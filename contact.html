<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kontakt — Custodians</title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #F8F7FC;
      --surface: #EFECF7;
      --white: #FFFFFF;

      --ink: #1A1625;
      --ink-light: #6B6080;
      --ink-faint: #A89EC0;

      --purple: #3D2B6E;
      --purple-mid: #6B4ED4;
      --purple-deep: #2D1F56;

      --border: rgba(61,43,110,0.09);

      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;

      --r-pill: 999px;
      --r-lg: 32px;

      --shadow-sm: 0 20px 40px -28px rgba(61,43,110,0.3);
      --shadow-nav: 0 20px 40px -24px rgba(61,43,110,0.25);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 32px;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(2.5rem, 5.5vw, 3.9rem);
      font-weight: 300;
      line-height: 1.06;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    p {
      color: var(--ink-light);
      font-size: 15px;
      line-height: 1.75;
    }

    /* NAV */

    #nav {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 20px 0 0;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--white);
      border-radius: var(--r-pill);
      padding: 14px 28px;
      box-shadow: var(--shadow-nav);
      position: relative;
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 400;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .nav-logo .dot {
      color: var(--purple-mid);
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 13px;
      color: var(--ink-light);
      text-decoration: none;
      transition: color 0.12s;
    }

    .nav-links a:hover {
      color: var(--ink);
    }

    .nav-links a.active {
      color: var(--ink);
    }

    .nav-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 34px;
      height: 34px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .nav-toggle span {
      display: block;
      width: 100%;
      height: 2px;
      background: var(--ink);
      border-radius: 2px;
      transition: transform .2s, opacity .2s;
    }

    .nav-toggle.open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .nav-toggle.open span:nth-child(2) {
      opacity: 0;
    }

    .nav-toggle.open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* CONTACT */

    #contact {
      min-height: calc(100vh - 160px);
      padding: 100px 0 88px;
      position: relative;
      overflow: hidden;
    }

    #contact::after {
      content: '';
      position: absolute;
      top: -200px;
      right: -140px;
      width: 640px;
      height: 640px;
      border-radius: 999px;
      background: radial-gradient(
        ellipse,
        rgba(107,78,212,0.16) 0%,
        transparent 68%
      );
      pointer-events: none;
    }

    .contact-content {
      max-width: 620px;
      position: relative;
      z-index: 1;
    }

    .contact-content h1 {
      margin-bottom: 24px;
    }

    .lead {
      max-width: 520px;
      margin-bottom: 40px;
    }

    .mail-link {
      display: inline-block;
      font-family: var(--serif);
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--purple);
      text-decoration: none;
      margin-bottom: 16px;
    }

    .mail-link:hover {
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    .note {
      font-size: 13px;
      color: var(--ink-faint);
    }

    /* FOOTER */

    footer {
      padding: 48px 0 24px;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: var(--serif);
      font-size: 15px;
      color: var(--ink-light);
      letter-spacing: -0.01em;
    }

    .footer-note {
      font-size: 11px;
      color: rgba(107,96,128,0.65);
    }

    /* MOBILE */

    @media (max-width: 860px) {

      .container {
        padding: 0 20px;
      }

      #nav {
        padding: 14px 0 0;
      }

      .nav-inner {
        padding: 12px 18px;
      }

      .nav-links {
        display: flex;
        gap: 18px;
      }

      .nav-links a {
        font-size: 12px;
      }

      #contact {
        padding: 64px 0 56px;
      }

      .footer-inner {
        gap: 12px;
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 640px) {

      .nav-toggle {
        display: flex;
      }

      .nav-links {
        position: absolute;
        top: calc(100% + 10px);
        left: 0;
        right: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        background: var(--white);
        border-radius: 20px;
        padding: 12px;
        box-shadow: var(--shadow-nav);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px);
        transition: opacity .18s, transform .18s, visibility .18s;
      }

      .nav-links.open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .nav-links li {
        width: 100%;
      }

      .nav-links a {
        display: block;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
      }

      .nav-links a:hover,
      .nav-links a.active {
        background: var(--surface);
      }
    }
  </style>
</head>

<body>

<nav id="nav">
  <div class="container">
    <div class="nav-inner">

      <a href="index.html" class="nav-logo">
        Custodians<span class="dot">.</span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Forside</a></li>
        <li><a href="ydelser.html">Ydelser</a></li>
        <li><a href="about.html">Om os</a></li>
        <li><a href="contact.html" class="active">Kontakt</a></li>
      </ul>

      <button class="nav-toggle" id="navToggle" aria-label="Åbn menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

    </div>
  </div>
</nav>

<section id="contact">
  <div class="container">

    <div class="contact-content">

      <h1>Kontakt os</h1>

      <p class="lead">
        Hvis I vil høre mere om, hvordan Custodians hjælper med AML-compliance i praksis,
        er I velkomne til at skrive direkte til os.
      </p>

      <a class="mail-link" href="mailto:info@custodians.dk">
        info@custodians.dk
      </a>

      <p class="note">
        Vi svarer inden for én hverdag.
      </p>

    </div>

  </div>
</section>

<footer>
  <div class="container">

    <div class="footer-inner">

      <span class="footer-logo">
        Custodians.
      </span>

      <p class="footer-note">
        © 2025 · AML-compliance i praksis
      </p>

    </div>

  </div>
</footer>

<script>
  (function () {
    var toggle = document.getElementById('navToggle');
    var links = document.getElementById('navLinks');
    if (!toggle || !links) return;
    toggle.addEventListener('click', function () {
      var isOpen = links.classList.toggle('open');
      toggle.classList.toggle('open', isOpen);
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    links.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () {
        links.classList.remove('open');
        toggle.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  })();
</script>

</body>
</html>
