<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kontakt — Custodians</title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #F8F7FC;
      --surface: #EFECF7;
      --white: #FFFFFF;

      --ink: #1A1625;
      --ink-light: #6B6080;
      --ink-faint: #A89EC0;

      --purple: #3D2B6E;
      --purple-mid: #6B4ED4;

      --border: rgba(61,43,110,0.09);

      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 32px;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(2.5rem, 5.5vw, 3.9rem);
      font-weight: 300;
      line-height: 1.06;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    p {
      color: var(--ink-light);
      font-size: 15px;
      line-height: 1.75;
    }

    /* NAV */

    #nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(248,247,252,0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 400;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .nav-logo .dot {
      color: var(--purple-mid);
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 13px;
      color: var(--ink-light);
      text-decoration: none;
      transition: color 0.12s;
    }

    .nav-links a:hover {
      color: var(--ink);
    }

    /* CONTACT */

    #contact {
      min-height: calc(100vh - 140px);
      padding: 120px 0 96px;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    #contact::after {
      content: '';
      position: absolute;
      top: -160px;
      right: -120px;
      width: 600px;
      height: 600px;
      background: radial-gradient(
        ellipse,
        rgba(107,78,212,0.07) 0%,
        transparent 65%
      );
      pointer-events: none;
    }

    .contact-content {
      max-width: 620px;
      position: relative;
      z-index: 1;
    }

    .contact-content h1 {
      margin-bottom: 24px;
    }

    .lead {
      max-width: 520px;
      margin-bottom: 40px;
    }

    .mail-link {
      display: inline-block;
      font-family: var(--serif);
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--purple);
      text-decoration: none;
      margin-bottom: 16px;
    }

    .mail-link:hover {
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    .note {
      font-size: 13px;
      color: var(--ink-faint);
    }

    /* FOOTER */

    footer {
      background: #100C1C;
      border-top: 1px solid rgba(255,255,255,.05);
      padding: 24px 0;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: var(--serif);
      font-size: 15px;
      color: rgba(255,255,255,.28);
      letter-spacing: -0.01em;
    }

    .footer-note {
      font-size: 11px;
      color: rgba(255,255,255,.14);
    }

    /* MOBILE */

    @media (max-width: 860px) {

      .container {
        padding: 0 20px;
      }

      .nav-links {
        display: flex;
        gap: 18px;
      }

      .nav-links a {
        font-size: 12px;
      }

      #contact {
        padding: 80px 0 72px;
      }

      .footer-inner {
        gap: 12px;
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<nav id="nav">
  <div class="container">
    <div class="nav-inner">

      <a href="index.html" class="nav-logo">
        Custodians<span class="dot">.</span>
      </a>

    <ul class="nav-links">
  <li><a href="/">Forside</a></li>
  <li><a href="/about">Om os</a></li>
  <li><a href="/contact">Kontakt</a></li>
</ul>
      </ul>

    </div>
  </div>
</nav>

<section id="contact">
  <div class="container">

    <div class="contact-content">

      <h1>Kontakt os</h1>

      <p class="lead">
        Hvis I vil høre mere om, hvordan Custodians hjælper med AML-compliance i praksis,
        er I velkomne til at skrive direkte til os.
      </p>

      <a class="mail-link" href="mailto:info@custodians.dk">
        info@custodians.dk
      </a>

      <p class="note">
        Vi svarer inden for én hverdag.
      </p>

    </div>

  </div>
</section>

<footer>
  <div class="container">

    <div class="footer-inner">

      <span class="footer-logo">
        Custodians.
      </span>

      <p class="footer-note">
        © 2025 · AML-compliance i praksis
      </p>

    </div>

  </div>
</footer>

</body>
</html>
```
